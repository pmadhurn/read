name: read

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: read
      POSTGRES_DB: read
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U read -d read"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ./app
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://read:${POSTGRES_PASSWORD}@db:5432/read
      SECRET_KEY: ${SECRET_KEY}
      INITIAL_FAMILY_PASSCODE: ${INITIAL_FAMILY_PASSCODE}
      INITIAL_ADMIN_PIN: ${INITIAL_ADMIN_PIN}
      PUBLIC_URL: ${PUBLIC_URL}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_PROFILES: ${MAX_PROFILES:-10}
      STORAGE_PLAN_GB: ${STORAGE_PLAN_GB:-10}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      DATA_DIR: /data
      BACKUP_DIR: /backups
      WEB_DIR: /web
    volumes:
      - books:/data
      - ${BACKUP_DIR:-./backups}:/backups
      - ./web:/web:ro

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "127.0.0.1:${HTTP_PORT:-8160}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  books:
